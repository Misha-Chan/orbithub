<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراسلات</title>
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="me" id="meBox"></div>
        <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج">⏻</button>
      </div>

      <div class="new-chat">
        <input type="text" id="newChatInput" placeholder="راسل مستخدماً باسمه...">
        <button class="btn btn-primary" id="newChatBtn">فتح</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="dms">محادثات</button>
        <button class="tab" data-tab="groups">مجموعات</button>
      </div>

      <div class="list" id="dmList"></div>
      <div class="list" id="groupList" style="display:none"></div>

      <button class="btn btn-ghost new-group-btn" id="newGroupBtn" style="display:none">+ مجموعة جديدة</button>
    </aside>

    <main class="thread">
      <div id="emptyState" class="empty-state">
        <div class="empty-emoji">💬</div>
        <div>اختر محادثة أو ابدأ واحدة جديدة</div>
      </div>

      <div id="threadView" class="thread-view" style="display:none">
        <header class="thread-header">
          <div class="thread-title">
            <div class="avatar" id="threadAvatar"></div>
            <div>
              <div id="threadName" class="thread-name"></div>
              <div id="threadSub" class="thread-sub"></div>
            </div>
          </div>
          <div class="thread-actions">
            <label class="encrypt-toggle" id="encryptToggleWrap" title="تشفير طرف لطرف">
              <input type="checkbox" id="encryptToggle"> 🔒
            </label>
            <button class="icon-btn" id="groupMembersBtn" style="display:none" title="الأعضاء">👥</button>
            <button class="icon-btn" id="deleteConvBtn" title="حذف المحادثة">🗑</button>
          </div>
        </header>

        <div class="messages" id="messagesEl"></div>
        <div class="typing-indicator" id="typingEl"></div>

        <div id="replyBar" class="reply-bar" style="display:none">
          <span id="replyText"></span>
          <button id="cancelReply">✕</button>
        </div>

        <form class="composer" id="composerForm">
          <input type="text" id="imageUrlInput" class="image-url" placeholder="رابط صورة (اختياري)">
          <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
          <button type="submit" class="btn btn-primary">إرسال</button>
        </form>
      </div>
    </main>
  </div>

  <!-- نافذة إعداد/فتح تشفير PIN -->
  <div id="pinModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 id="pinTitle">تفعيل التشفير</h3>
      <p id="pinDesc" class="modal-desc"></p>
      <input type="text" id="pinInput" maxlength="6" inputmode="numeric" placeholder="رمز مكوّن من 6 أرقام">
      <div class="err" id="pinErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pinCancel">إلغاء</button>
        <button class="btn btn-primary" id="pinConfirm">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- نافذة مجموعة جديدة -->
  <div id="groupModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>مجموعة جديدة</h3>
      <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
      <textarea id="groupDescInput" placeholder="وصف مختصر (اختياري)" rows="2"></textarea>
      <div class="err" id="groupErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="groupCancel">إلغاء</button>
        <button class="btn btn-primary" id="groupConfirm">إنشاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة أعضاء المجموعة -->
  <div id="membersModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>أعضاء المجموعة</h3>
      <div id="membersList" class="members-list"></div>
      <div class="add-member">
        <input type="text" id="addMemberInput" placeholder="اسم مستخدم للإضافة">
        <button class="btn btn-primary" id="addMemberBtn">إضافة</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="membersClose">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/crypto.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
