<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">Hostaka — Messages</title>
<script src="/i18n.js"></script>
<link rel="icon" href="https://hostaka.fun/hostaka-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/bridge.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/emoji.css">
<link rel="stylesheet" href="/chat.css">
<script src="/emoji.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="me" id="meBox"></div>
        <button class="icon-btn" id="logoutBtn" title="Log out" data-i18n-title="nav.logout">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <div class="new-chat">
        <input type="text" id="newChatInput" placeholder="Message a user by name..." data-i18n-placeholder="composer.new_chat_placeholder">
        <button class="btn btn-primary" id="newChatBtn" data-i18n="composer.open">Open</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="dms" data-i18n="tabs.dms">Chats</button>
        <button class="tab" data-tab="groups" data-i18n="tabs.groups">Groups</button>
      </div>

      <div class="list" id="dmList"></div>
      <div class="list" id="groupList" style="display:none"></div>

      <button class="btn btn-ghost new-group-btn" id="newGroupBtn" style="display:none" data-i18n="groups.new">+ New group</button>
    </aside>

    <main class="thread">
      <div id="emptyState" class="empty-state">
        <div class="empty-emoji">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div data-i18n="empty.select">Pick a chat or start a new one</div>
      </div>

      <div id="threadView" class="thread-view" style="display:none">
        <header class="thread-header">
          <div class="thread-title">
            <button class="icon-btn back-btn" id="backToListBtn" title="Back" data-i18n-title="nav.back">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <div class="thread-title-clickable" id="threadTitleClickable" style="display:flex;align-items:center;gap:10px;cursor:pointer">
              <div class="avatar" id="threadAvatar"></div>
              <div class="thread-title-info" id="threadTitleInfo">
                <div id="threadName" class="thread-name"></div>
                <div id="threadSub" class="thread-sub"></div>
              </div>
            </div>
          </div>
          <div class="thread-actions">
            <label class="encrypt-toggle" id="encryptToggleWrap" title="End-to-end encryption" data-i18n-title="chat.e2e_title">
              <input type="checkbox" id="encryptToggle"> 🔒
            </label>
            <button class="icon-btn" id="groupMembersBtn" style="display:none" title="Members" data-i18n-title="chat.members_title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
            <button class="icon-btn" id="deleteConvBtn" title="Delete conversation" data-i18n-title="chat.delete_conv_title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </header>

        <div class="messages" id="messagesEl"></div>
        <div class="typing-indicator" id="typingEl"></div>

        <div id="replyBar" class="reply-bar" style="display:none">
          <span id="replyText"></span>
          <button id="cancelReply">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <input type="file" id="imageFileInput" accept="image/*" hidden>
          <button type="button" class="icon-btn" id="attachImageBtn" title="Attach image" data-i18n-title="composer.attach_title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <span class="image-preview-name" id="imagePreviewName"></span>
          <button type="button" class="icon-btn" id="chatEmojiBtn" title="Emoji" data-i18n-title="composer.emoji_title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" data-i18n-placeholder="composer.placeholder">
          <button type="submit" class="btn btn-primary" id="sendBtn" data-i18n="composer.send">Send</button>
        </form>
      </div>
    </main>
  </div>

  <!-- نافذة إعداد/فتح تشفير PIN -->
  <div id="pinModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 id="pinTitle" data-i18n="pin.title">Enable encryption</h3>
      <p id="pinDesc" class="modal-desc"></p>
      <input type="text" id="pinInput" maxlength="6" inputmode="numeric" placeholder="6-digit code" data-i18n-placeholder="pin.placeholder">
      <div class="err" id="pinErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pinCancel" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-primary" id="pinConfirm" data-i18n="common.confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- نافذة مجموعة جديدة -->
  <div id="groupModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 data-i18n="groups.new_title">New group</h3>
      <input type="text" id="groupNameInput" placeholder="Group name" data-i18n-placeholder="groups.name_placeholder">
      <textarea id="groupDescInput" placeholder="Short description (optional)" rows="2" data-i18n-placeholder="groups.desc_placeholder"></textarea>
      <div class="err" id="groupErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="groupCancel" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-primary" id="groupConfirm" data-i18n="common.create">Create</button>
      </div>
    </div>
  </div>

  <!-- نافذة أعضاء المجموعة -->
  <div id="membersModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 data-i18n="members.title">Group members</h3>
      <div id="membersList" class="members-list"></div>
      <div class="add-member">
        <input type="text" id="addMemberInput" placeholder="Username to add" data-i18n-placeholder="members.add_placeholder">
        <button class="btn btn-primary" id="addMemberBtn" data-i18n="common.add">Add</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="membersClose" data-i18n="common.close">Close</button>
      </div>
    </div>
  </div>

  <!-- قائمة خيارات رأس المحادثة (اسم/صورة المستخدم أو المجموعة) -->
  <div id="chatMenuBackdrop" class="msg-menu-backdrop" style="display:none"></div>
  <div id="chatMenu" class="msg-menu chat-menu" style="display:none"></div>

  <!-- قائمة خيارات الرسالة (ضغط مطوّل بالهاتف / ضغطتين بالديسكتوب) -->
  <div id="msgMenuBackdrop" class="msg-menu-backdrop" style="display:none"></div>
  <div id="msgMenu" class="msg-menu" style="display:none"></div>

  <!-- معرض الوسائط -->
  <div id="mediaModal" class="modal-overlay" style="display:none">
    <div class="modal media-modal">
      <h3 data-i18n="media.title">Media</h3>
      <div id="mediaGrid" class="media-grid"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="mediaClose" data-i18n="common.close">Close</button>
      </div>
    </div>
  </div>

  <!-- عرض الصورة بالحجم الكامل -->
  <div id="imageLightbox" class="lightbox" style="display:none">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-body">
      <img id="lightboxImg" src="">
      <div class="lightbox-actions">
        <button id="lightboxDownload" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-left:5px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="common.download">Download</span>
        </button>
        <button class="icon-btn" id="lightboxClose" title="Close" data-i18n-title="common.close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/crypto.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
