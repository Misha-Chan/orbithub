<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراسلات — Hostaka</title>
<link rel="icon" href="https://hostaka.fun/hostaka-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/bridge.css">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/emoji.css">
<link rel="stylesheet" href="/chat.css">
<script src="/emoji.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="me" id="meBox"></div>
        <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>

      <div class="new-chat">
        <input type="text" id="newChatInput" placeholder="راسل مستخدماً باسمه...">
        <button class="btn btn-primary" id="newChatBtn">فتح</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="dms">محادثات</button>
        <button class="tab" data-tab="groups">مجموعات</button>
      </div>

      <div class="list" id="dmList"></div>
      <div class="list" id="groupList" style="display:none"></div>

      <button class="btn btn-ghost new-group-btn" id="newGroupBtn" style="display:none">+ مجموعة جديدة</button>
    </aside>

    <main class="thread">
      <div id="emptyState" class="empty-state">
        <div class="empty-emoji">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div>اختر محادثة أو ابدأ واحدة جديدة</div>
      </div>

      <div id="threadView" class="thread-view" style="display:none">
        <header class="thread-header">
          <div class="thread-title">
            <button class="icon-btn back-btn" id="backToListBtn" title="رجوع">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <div class="avatar" id="threadAvatar"></div>
            <div>
              <div id="threadName" class="thread-name"></div>
              <div id="threadSub" class="thread-sub"></div>
            </div>
          </div>
          <div class="thread-actions">
            <label class="encrypt-toggle" id="encryptToggleWrap" title="تشفير طرف لطرف">
              <input type="checkbox" id="encryptToggle"> 🔒
            </label>
            <button class="icon-btn" id="groupMembersBtn" style="display:none" title="الأعضاء">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
            <button class="icon-btn" id="deleteConvBtn" title="حذف المحادثة">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </header>

        <div class="messages" id="messagesEl"></div>
        <div class="typing-indicator" id="typingEl"></div>

        <div id="replyBar" class="reply-bar" style="display:none">
          <span id="replyText"></span>
          <button id="cancelReply">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <input type="file" id="imageFileInput" accept="image/*" hidden>
          <button type="button" class="icon-btn" id="attachImageBtn" title="إرفاق صورة">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <span class="image-preview-name" id="imagePreviewName"></span>
          <button type="button" class="icon-btn" id="chatEmojiBtn" title="إيموجي">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
          <button type="submit" class="btn btn-primary" id="sendBtn">إرسال</button>
        </form>
      </div>
    </main>
  </div>

  <!-- نافذة إعداد/فتح تشفير PIN -->
  <div id="pinModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 id="pinTitle">تفعيل التشفير</h3>
      <p id="pinDesc" class="modal-desc"></p>
      <input type="text" id="pinInput" maxlength="6" inputmode="numeric" placeholder="رمز مكوّن من 6 أرقام">
      <div class="err" id="pinErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pinCancel">إلغاء</button>
        <button class="btn btn-primary" id="pinConfirm">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- نافذة مجموعة جديدة -->
  <div id="groupModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>مجموعة جديدة</h3>
      <input type="text" id="groupNameInput" placeholder="اسم المجموعة">
      <textarea id="groupDescInput" placeholder="وصف مختصر (اختياري)" rows="2"></textarea>
      <div class="err" id="groupErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="groupCancel">إلغاء</button>
        <button class="btn btn-primary" id="groupConfirm">إنشاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة أعضاء المجموعة -->
  <div id="membersModal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>أعضاء المجموعة</h3>
      <div id="membersList" class="members-list"></div>
      <div class="add-member">
        <input type="text" id="addMemberInput" placeholder="اسم مستخدم للإضافة">
        <button class="btn btn-primary" id="addMemberBtn">إضافة</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="membersClose">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- قائمة خيارات الرسالة (ضغط مطوّل بالهاتف / ضغطتين بالديسكتوب) -->
  <div id="msgMenuBackdrop" class="msg-menu-backdrop" style="display:none"></div>
  <div id="msgMenu" class="msg-menu" style="display:none"></div>

  <script src="/shared.js"></script>
  <script src="/crypto.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
