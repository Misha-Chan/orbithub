<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام المراسلات</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    width: 100%; max-width: 380px; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px; margin: 16px;
  }
  .logo { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--text-dim); }
  .tabs { display: flex; gap: 4px; background: var(--bg-elevated); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 20px; }
  .tabs button { flex: 1; background: none; border: none; color: var(--text-dim); padding: 9px; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .tabs button.active { background: var(--accent); color: var(--accent-contrast); }
  form { display: none; }
  form.active { display: block; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .btn-primary { width: 100%; padding: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">💬 نظام المراسلات</div>
    <div class="sub">دردشة خاصة ومجموعات، مع تشفير طرف-لطرف اختياري</div>

    <div class="tabs">
      <button id="tabLogin" class="active">دخول</button>
      <button id="tabRegister">حساب جديد</button>
    </div>

    <form id="loginForm" class="active">
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" required></div>
      <div class="err" id="loginErr"></div>
      <button type="submit" class="btn btn-primary">دخول</button>
    </form>

    <form id="registerForm">
      <div class="field"><label>اسم المستخدم</label><input type="text" id="regUsername" required minlength="3"></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="regEmail" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="regPassword" required minlength="8"></div>
      <div class="err" id="regErr"></div>
      <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
    </form>
  </div>

  <script src="/shared.js"></script>
  <script src="/login.js"></script>
</body>
</html>
